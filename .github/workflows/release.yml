name: Release · 三平台构建与发布

# 触发方式：
#   1) 推送 v* 标签（例如 v2.0.0）；
#   2) 手动触发，指定标签（用于预演 / 私有测试 Release）。
#
# 设计原则：
#   - 默认最小权限读取；只有最后的 release 任务拿到 contents: write。
#   - 所有构建都在 GitHub 官方 Runner 上完成，不执行任何第三方构建脚本；
#     用到的 Actions 全部固定到 commit SHA。
#   - 版本号唯一来源是 pubspec.yaml 的 version，标签必须与之一致。
#   - Android 正式签名通过 Secrets 注入，密钥不落日志、不落仓库。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（必须与 pubspec.yaml 版本一致，例如 v2.0.0）'
        required: true
        type: string
      draft:
        description: '创建为草稿 Release（不公开）'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.0
  FLUTTER_LINUX_SHA256: 6ea2d806fd57269ae783e6788e2a81fc26eaad782f1e0d0ff38623bb765ff9f5
  FLUTTER_WINDOWS_SHA256: 35fb843409c80a1c69b64bbae1756bba437222f909622d83540e266e1759aab8

jobs:
  # 版本一致性检查 + 代码质量门禁
  verify:
    name: 版本检查 / 分析 / 测试
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: 计算版本号并校验标签
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          # pubspec: 2.0.0+5 -> 语义版本 2.0.0，构建号 5
          SEMVER="${VERSION%%+*}"
          if [ -z "$SEMVER" ]; then echo "无法从 pubspec.yaml 读取版本号" >&2; exit 1; fi
          if [ "$TAG_INPUT" != "v$SEMVER" ]; then
            echo "标签 '$TAG_INPUT' 与 pubspec 版本 'v$SEMVER' 不一致，拒绝发布。" >&2
            exit 1
          fi
          echo "version=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "tag=v$SEMVER" >> "$GITHUB_OUTPUT"
          echo "发布版本：$SEMVER"

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates git unzip xz-utils \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsqlite3-dev liblzma-dev libsecret-1-dev

      - name: 安装 Flutter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  # Windows：Release ZIP（完整便携目录，含全部运行库）
  build-windows:
    name: Windows x64 构建
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: 安装 Flutter（固定版本 + 校验 SHA-256）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'flutter.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip" `
            -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FLUTTER_WINDOWS_SHA256) { throw "Flutter 包校验失败：$hash" }
          Expand-Archive -Path $zip -DestinationPath 'C:\' -Force
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 解析依赖
        run: flutter pub get

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包便携目录（zip）
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'build\windows\x64\runner\Release'
          if (-not (Test-Path $src)) { throw "缺少构建产物：$src" }
          $stage = "dist\PlanTai-$env:VERSION-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$src\*" $stage -Recurse -Force
          # 随包附带用户说明（不是构建必需，但对下载者有用）
          Copy-Item 'docs\USER_GUIDE.md'    "$stage\用户操作说明.md"   -Force
          Copy-Item 'docs\KNOWN_ISSUES.md'  "$stage\已知问题.md"       -Force
          Copy-Item 'docs\DATA_AND_BACKUP.md' "$stage\数据与备份说明.md" -Force
          $zip = "dist\PlanTai-$env:VERSION-Windows-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash -Path $zip -Algorithm SHA256 | Select-Object Hash, Path

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # Ubuntu：.deb 安装包
  build-linux:
    name: Ubuntu amd64 构建
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates git unzip xz-utils \
            clang cmake ninja-build pkg-config liblzma-dev dpkg-dev \
            libgtk-3-dev libsqlite3-dev libsecret-1-dev

      - name: 安装 Flutter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter pub get

      - name: 构建 Linux Release
        run: flutter build linux --release

      - name: 生成 .deb
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # deb 版本沿用 pubspec 的完整版本（含构建号），保证 apt 升级比较正确
          FULL="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 | tr -d '[:space:]')"
          VERSION="$FULL" bash packaging/linux/build_deb.sh
          mkdir -p out
          cp "dist/jihuatai_${FULL}_amd64.deb" "out/PlanTai-${VERSION}-Ubuntu-amd64.deb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14

  # Android：正式签名 APK（Secrets 提供 keystore；缺失则跳过并明确标注）
  check-android-signing:
    name: 检查 Android 签名 Secrets
    runs-on: ubuntu-22.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: 检查
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android 正式签名 Secrets 已配置。"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 Android 签名 Secrets，跳过正式 APK 构建（不会用 debug 签名冒充发布包）。"
          fi

  build-android:
    name: Android 正式签名构建
    needs: [verify, check-android-signing]
    if: needs.check-android-signing.outputs.available == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Flutter
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: 写入签名配置（Secrets 注入，不打印内容）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?缺少 ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?缺少 ANDROID_KEY_ALIAS}"
          KEY_DIR="$RUNNER_TEMP/android-keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEY_DIR/release.jks"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$KEY_PASS
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEY_DIR/release.jks
          EOF
          chmod 600 android/key.properties

      - run: flutter pub get

      - name: 构建 split-per-abi Release APK
        run: flutter build apk --release --split-per-abi

      - name: 校验签名者不是 Debug 证书
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n1)"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f" | tee "$RUNNER_TEMP/cert.txt"
            if grep -qi 'Android Debug' "$RUNNER_TEMP/cert.txt"; then
              echo "::error::$f 使用 Debug 签名，拒绝发布"; exit 1
            fi
          done

      - name: 整理产物
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  "out/PlanTai-${VERSION}-Android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/PlanTai-${VERSION}-Android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk     "out/PlanTai-${VERSION}-Android-x86_64.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  # 发布：汇总真实产物 -> 生成 SHA-256 -> 创建 Release -> 上传
  publish:
    name: 创建 GitHub Release
    needs: [verify, build-windows, build-linux, build-android]
    # build-android 被跳过时（无签名 Secrets）仍允许发布其它平台，但会明确记录
    if: always() && needs.verify.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 生成 SHA-256 校验文件
        run: |
          set -euo pipefail
          cd assets
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          DRAFT: ${{ github.event.inputs.draft || 'true' }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "PlanTai ${TAG} — First Cross-Platform Release" \
              --notes-file "$NOTES" \
              --draft=$DRAFT
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "PlanTai ${TAG}" \
              --generate-notes \
              --draft=$DRAFT
          fi
