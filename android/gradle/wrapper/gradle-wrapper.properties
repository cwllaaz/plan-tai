distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# 官方分发 CDN。不要用 services.gradle.org 的短链：本机网络下它会重定向到 GitHub，
# 实测约 70KB/s（230MB 的 -all 包要 50 分钟）。downloads.gradle.org 是同一个官方源，
# 实测约 1MB/s；-bin 包（140MB）足够构建，不需要 -all 的源码/文档。
distributionUrl=https\://downloads.gradle.org/distributions/gradle-9.5.0-bin.zip
